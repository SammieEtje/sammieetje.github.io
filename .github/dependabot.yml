# 001:T020 Weekly update proposals for packages and pipeline actions (001:FR-021)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 002:T022 Majors the toolchain cannot accept yet: @astrojs/check and typescript-eslint
    # support TypeScript < 6.1; @types/node follows the Node 24 runtime.
    ignore:
      - dependency-name: typescript
        versions: ['>=6.1.0']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
