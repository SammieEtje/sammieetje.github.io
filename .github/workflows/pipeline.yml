# 001:T018 The golden path: one quality gate for every change, one deploy for every gated build on main
# 009:T005 Five jobs: checks, three parallel budget shards, a merged report, one aggregate
# quality-gate (the required check) and the deploy. Contract: specs/009-scorecard/contracts/pipeline.md
name: Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Formatting
        id: format
        run: npm run format:check
      - name: Lint
        id: lint
        run: npm run lint
      - name: Types
        id: typecheck
        run: npm run typecheck
      - name: Unit tests
        id: unit
        run: npm run test:unit
      - name: Traceability
        id: trace
        run: npm run trace
      - name: Build
        id: build
        run: npm run build
      - name: End-to-end and accessibility tests
        id: e2e
        run: npm run test:e2e
      - name: Internal links
        id: links
        run: npm run links

      # 001:T018 One summary per run (001:FR-019)
      - name: Summary
        if: ${{ always() }}
        env:
          FORMAT: ${{ steps.format.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          TRACE: ${{ steps.trace.outcome }}
          BUILD: ${{ steps.build.outcome }}
          E2E: ${{ steps.e2e.outcome }}
          LINKS: ${{ steps.links.outcome }}
        run: |
          {
            echo "### Checks"
            echo "| Check | Outcome | Run locally |"
            echo "|---|---|---|"
            echo "| Formatting | $FORMAT | \`npm run format:check\` |"
            echo "| Lint | $LINT | \`npm run lint\` |"
            echo "| Types | $TYPECHECK | \`npm run typecheck\` |"
            echo "| Unit tests | $UNIT | \`npm run test:unit\` |"
            echo "| Traceability | $TRACE | \`npm run trace\` |"
            echo "| Build | $BUILD | \`npm run build\` |"
            echo "| End-to-end + accessibility | $E2E | \`npm run test:e2e\` |"
            echo "| Internal links | $LINKS | \`npm run links\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
      - name: Keep test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: reports/
          retention-days: 7
      - name: Keep Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  # 009:T005 Lighthouse budgets in parallel shards over the tested build (009:FR-001)
  budgets:
    name: budgets ${{ matrix.shard }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Get the tested build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Budgets
        env:
          LHCI_SHARD: ${{ matrix.shard }}
        run: npm run budgets
      - name: Keep shard results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ strategy.job-index }}
          path: .lighthouseci/reports/
          if-no-files-found: ignore
          retention-days: 7

  # 009:T005 One merged report per run; on main it ships with the site (009:FR-003, 009:FR-004)
  report:
    name: report
    needs: [checks, budgets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Get shard results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lighthouse-*
          path: .lighthouseci/shards
      - name: Get test results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-reports
          path: reports
      # 010:T004 The report measures embedded script from the built pages on every run (010:FR-001)
      - name: Get the tested build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Merge the quality report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          export RUN_STARTED_AT="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .run_started_at)"
          node scripts/quality-report.ts
      - name: Keep quality report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-report
          path: quality-report.json
      - name: Add the report to the site
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: mkdir -p dist/quality && cp quality-report.json dist/quality/report.json
      - name: Package site for Pages
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # 009:T005 The single required check: green only if every job above succeeded (009:FR-002)
  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs: [checks, budgets, report]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every check passed
        run: |
          echo "checks=${{ needs.checks.result }} budgets=${{ needs.budgets.result }} report=${{ needs.report.result }}"
          test "${{ needs.checks.result }}" = success
          test "${{ needs.budgets.result }}" = success
          test "${{ needs.report.result }}" = success

  deploy:
    name: deploy
    needs: quality-gate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
